[package]
name = "gutenberg-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gutenberg egui frontend (InDesign-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
gutenberg-geom = { workspace = true }
gutenberg-color = { workspace = true }
gutenberg-doc = { workspace = true }
gutenberg-fonts = { workspace = true }
gutenberg-compose = { workspace = true }
gutenberg-render = { workspace = true }
gutenberg-tools = { workspace = true }
gutenberg-engine = { workspace = true }
regex = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# Headless (offscreen wgpu) rendering of the whole window for UI screenshots: `examples/ui_shot.rs`.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
