[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gutenbergs-hoard"
version = "0.1.0"
description = "A local editorial publishing workspace backed by DesignCraft's native layout engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.30,<1",
  "mcp>=1.20,<2",
  "pillow>=10,<14",
  "pypdf>=3.17,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["gutenberg_hoard*"]

[tool.setuptools.package-data]
gutenberg_hoard = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
